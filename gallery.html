@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap");



:root{

  color-scheme:dark;

  --ice:#dff8ff;--cyan:#80eaff;--blue:#6daeff;

  --glass:rgba(255,255,255,.075);

  --glass-strong:rgba(255,255,255,.12);

  --line:rgba(220,245,255,.18);

  --muted:rgba(235,247,255,.62);

  --ease:cubic-bezier(.2,.75,.25,1);

}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{

  margin:0;min-height:100vh;padding:1px 0 32px;

  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  color:#f6fbff;overflow-x:hidden;

  background:#07101e url("bg.jpg") center/cover fixed no-repeat;

  -webkit-tap-highlight-color:transparent;

}

body::before{

  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;

  background:

    radial-gradient(ellipse at 15% 5%,rgba(38,157,255,.18),transparent 38%),

    radial-gradient(ellipse at 88% 35%,rgba(98,92,255,.15),transparent 36%),

    linear-gradient(135deg,rgba(3,9,20,.82),rgba(6,15,30,.69) 55%,rgba(2,8,19,.86));

}

body::after{

  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.16;

  background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .6px);

  background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 90%);

}

button,input,a{-webkit-tap-highlight-color:transparent}

a{color:inherit}

button{font:inherit}

.liquid-text{

  font-family:Orbitron,Inter,sans-serif;color:#fff;

  text-shadow:0 0 22px rgba(111,220,255,.25);

}

.header{

  width:min(1120px,calc(100% - 36px));margin:24px auto 26px;

  display:flex;justify-content:space-between;align-items:center;gap:18px;

  padding:16px 20px;border:1px solid var(--line);border-radius:22px;

  background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.035));

  box-shadow:0 16px 50px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);

  backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);

}

.back-home,.pw-back-btn{

  display:inline-flex;align-items:center;gap:9px;text-decoration:none;

  color:rgba(245,251,255,.76);font-family:Orbitron,Inter,sans-serif;

  font-size:10px;font-weight:600;letter-spacing:1.2px;transition:color .25s,transform .25s;

}

.back-home:hover,.pw-back-btn:hover{color:var(--cyan);transform:translateX(-3px)}

.header .liquid-text{font-size:clamp(12px,2vw,16px);letter-spacing:clamp(1px,.35vw,3px);text-align:right}

.gallery-container{

  width:min(1120px,calc(100% - 36px));margin:0 auto 48px;

  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));

  grid-auto-rows:clamp(145px,16vw,205px);grid-auto-flow:dense;gap:16px;

}

.gallery-item{

  position:relative;min-width:0;overflow:hidden;isolation:isolate;

  border-radius:22px;border:1px solid rgba(225,247,255,.19);

  background:rgba(255,255,255,.055);cursor:pointer;

  box-shadow:0 12px 30px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.13);

  transform:translateZ(0);transition:transform .45s var(--ease),border-color .35s,box-shadow .4s;

}

.gallery-item::before{

  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;

  background:linear-gradient(135deg,rgba(255,255,255,.17),transparent 24%,transparent 68%,rgba(110,220,255,.08));

  opacity:.65;transition:opacity .35s;

}

.gallery-item::after{

  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;

  background:linear-gradient(180deg,transparent 35%,rgba(2,7,17,.04) 48%,rgba(2,7,17,.78));

  opacity:.7;transition:opacity .35s;

}

.gallery-item:hover{

  transform:translateY(-4px) scale(1.008);border-color:rgba(143,230,255,.52);

  box-shadow:0 22px 44px rgba(0,0,0,.28),0 0 0 1px rgba(104,211,255,.08),0 0 28px rgba(62,176,255,.1);

}

.gallery-item:hover::before{opacity:1}

.gallery-item img{

  display:block;width:100%;height:100%;object-fit:cover;

  transition:transform .85s var(--ease),opacity .6s ease;pointer-events:none;

}

.gallery-item:hover img{transform:scale(1.055)}

.featured-wrapper{position:relative;width:100%;height:100%;overflow:hidden}

.featured-wrapper img{position:absolute;inset:0}

#imgBack{filter:blur(1px) brightness(.72);transform:scale(1.04)}

#featuredImg{object-fit:cover}

.item-tall{grid-row:span 2}

.item-wide{grid-column:span 2}

.item-featured{grid-column:span 2;grid-row:span 2}

.item-overlay{

  position:absolute;left:0;right:0;bottom:0;z-index:4;

  padding:32px 16px 16px;opacity:.9;pointer-events:none;

  background:linear-gradient(transparent,rgba(1,7,18,.28));

  transition:opacity .3s,transform .3s;

}

.item-title{

  display:inline-flex;align-items:center;gap:8px;

  font-family:Orbitron,Inter,sans-serif;font-size:11px;font-weight:600;

  letter-spacing:1.5px;color:#f5fcff;text-shadow:0 2px 14px rgba(0,0,0,.45);

}

.item-title::before{

  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;

  background:var(--cyan);box-shadow:0 0 12px rgba(128,234,255,.9);

}

.gallery-item:hover .item-overlay{opacity:1;transform:translateY(-2px)}

#password-screen{

  position:fixed;inset:0;z-index:20000;display:flex;flex-direction:column;

  justify-content:center;align-items:center;padding:24px;

  background:radial-gradient(ellipse at 50% 25%,rgba(31,111,170,.23),transparent 48%),

    linear-gradient(135deg,rgba(3,9,20,.97),rgba(8,17,32,.97));

  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);

  transition:opacity .45s ease,visibility .45s ease;

}

#password-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}

.pw-back-btn{position:absolute;top:34px;left:max(24px,calc((100% - 1080px)/2))}

.pw-box{

  width:min(100%,390px);padding:38px 30px 32px;text-align:center;

  border-radius:28px;border:1px solid rgba(223,246,255,.2);

  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));

  box-shadow:0 30px 100px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.16),0 0 50px rgba(67,172,255,.08);

  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);

}


.pw-box .liquid-text{font-size:13px!important;letter-spacing:2px;margin-bottom:10px!important}

.pw-subtitle{margin:0 0 23px;color:var(--muted);font-size:12px;line-height:1.6}

.pw-box input{

  width:100%;padding:15px 16px;border-radius:14px;outline:none;

  color:#fff;background:rgba(1,8,18,.35);border:1px solid rgba(224,246,255,.19);

  font:600 12px Orbitron,Inter,sans-serif;letter-spacing:2px;text-align:center;

  transition:border-color .25s,box-shadow .25s,*background* .25s;

}

.pw-box input::placeholder{color:rgba(235,247,255,.4)}

.pw-box input:focus{border-color:rgba(128,234,255,.72);background:rgba(1,8,18,.52);box-shadow:0 0 0 4px rgba(128,234,255,.09),0 0 24px rgba(89,193,255,.1)}

.pw-hint{margin-top:16px;font-size:10px;letter-spacing:.4px;color:rgba(235,247,255,.42)}

.error-shake{animation:shake .36s ease}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

#lightbox{

  position:fixed;inset:0;z-index:10000;display:none;justify-content:center;align-items:center;

  padding:76px 72px 34px;background:rgba(3,8,18,.82);

  backdrop-filter:blur(28px) saturate(130%);-webkit-backdrop-filter:blur(28px) saturate(130%);

}

#lightbox.active{display:flex;animation:lbFade .22s ease}

@keyframes lbFade{from{opacity:0}to{opacity:1}}

#lbImg{

  max-width:min(100%,1400px);max-height:100%;width:auto;height:auto;object-fit:contain;

  border-radius:18px;border:1px solid rgba(240,250,255,.18);

  box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 35px rgba(94,198,255,.08);

  pointer-events:none;

}

.lb-btn{

  position:absolute;display:grid;place-items:center;width:46px;height:46px;padding:0;

  color:#f8fcff;text-decoration:none;cursor:pointer;

  border:1px solid rgba(232,248,255,.2);border-radius:16px;

  background:rgba(255,255,255,.09);box-shadow:inset 0 1px rgba(255,255,255,.12);

  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

  transition:*background* .25s,border-color .25s,transform .25s;

}

.lb-btn:hover{background:rgba(128,234,255,.16);border-color:rgba(128,234,255,.5);transform:translateY(-2px)}

.lb-close{top:22px;right:22px;font-size:18px}

.lb-download{top:22px;left:22px}

.lb-prev,.lb-next{top:50%;transform:translateY(-50%);font-size:24px}

.lb-prev{left:18px}.lb-next{right:18px}

.lb-prev:hover,.lb-next:hover{transform:translateY(calc(-50% - 2px))}

.lb-counter{

  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);

  padding:8px 13px;border:1px solid rgba(232,248,255,.15);border-radius:999px;

  background:rgba(255,255,255,.07);color:rgba(245,251,255,.75);

  font:10px Orbitron,Inter,sans-serif;letter-spacing:1.4px;

  backdrop-filter:blur(14px);

}

@media(min-width:1400px){.gallery-container{grid-auto-rows:210px;gap:18px}}

@media(max-width:900px){

  .gallery-container{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:clamp(145px,24vw,205px);gap:13px}

  .item-featured{grid-column:span 2;grid-row:span 2}

  .header{margin-top:16px}

}

@media(max-width:620px){

  body{background-attachment:scroll}

  .header{width:calc(100% - 24px);margin:12px auto 18px;padding:14px;border-radius:18px;gap:10px}

  .back-home{font-size:9px;letter-spacing:.6px;white-space:nowrap}

  .header .liquid-text{font-size:11px;letter-spacing:1px}

  .gallery-container{width:calc(100% - 24px);grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(135px,34vw,190px);gap:10px}

  .gallery-item{border-radius:17px}

  .item-wide,.item-featured{grid-column:span 2}

  .item-featured{grid-row:span 2}

  .item-tall{grid-row:span 2}

  .item-overlay{padding:24px 12px 12px}

  .item-title{font-size:10px;letter-spacing:1px}

  #lightbox{padding:78px 14px 56px}

  #lbImg{max-width:100%;max-height:100%;border-radius:12px}

  .lb-btn{width:42px;height:42px;border-radius:14px}

  .lb-close{top:15px;right:15px}.lb-download{top:15px;left:15px}

  .lb-prev,.lb-next{top:auto;bottom:12px;transform:none}

  .lb-prev{left:calc(50% - 52px)}.lb-next{right:calc(50% - 52px)}

  .lb-prev:hover,.lb-next:hover{transform:translateY(-2px)}

  .lb-counter{bottom:23px;font-size:9px}

  .pw-box{padding:32px 22px 26px;border-radius:24px}

  .pw-back-btn{top:22px;left:20px;font-size:9px}

}

@media(prefers-reduced-motion:reduce){

  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

}


/* Minimal UI deterrents */
html, body, body * { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable="true"] { -webkit-user-select: text !important; user-select: text !important; }
img { -webkit-user-drag: none !important; }

</style>

            <svg viewBox="0 0 24 24" width="20" fill="white">

                <path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>

            </svg>

        </a>



        <button type="button" class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">‹</button>

        <button type="button" class="lb-btn lb-next" id="lbNext" aria-label="Next image">›</button>

        <img id="lbImg" src="" alt="Selected gallery image">

        <div class="lb-counter" id="lbCounter" aria-live="polite">01 / 60</div>

    </div>



    <script>

(() => {

  "use strict";



  const passwordInput = document.getElementById("pw-input");

  const passwordScreen = document.getElementById("password-screen");

  const pwContainer = document.getElementById("pw-container");

  const correctPassword = "20090603";

  const accessKey = "gallery_access";



  function unlockGallery() {

    passwordScreen.classList.add("hidden");

    sessionStorage.setItem(accessKey, "true");

    window.setTimeout(() => { passwordScreen.style.display = "none"; }, 480);

  }



  if (sessionStorage.getItem(accessKey) === "true") {

    passwordScreen.style.display = "none";

  } else {

    passwordInput.focus({ preventScroll: true });

  }



  passwordInput.addEventListener("input", () => {

    if (passwordInput.value === correctPassword) {

      unlockGallery();

      return;

    }

    if (passwordInput.value.length >= correctPassword.length) {

      pwContainer.classList.remove("error-shake");

      void pwContainer.offsetWidth;

      pwContainer.classList.add("error-shake");

      window.setTimeout(() => {

        pwContainer.classList.remove("error-shake");

        passwordInput.value = "";

      }, 420);

    }

  });



  passwordInput.addEventListener("keydown", event => {

    if (event.key === "Enter" && passwordInput.value !== correctPassword) {

      pwContainer.classList.remove("error-shake");

      void pwContainer.offsetWidth;

      pwContainer.classList.add("error-shake");

    }

  });



  // Synchronized to match all 60 gallery items

  const images = Array.from({ length: 60 }, (_, i) => `img${i + 1}.jpg`);

  const featuredImg = document.getElementById("featuredImg");

  const imgBack = document.getElementById("imgBack");

  const lightbox = document.getElementById("lightbox");

  const lbImg = document.getElementById("lbImg");

  const downloadLink = document.getElementById("downloadLink");

  const counter = document.getElementById("lbCounter");

  let featuredIndex = 0;

  let currentIndex = 0;

  let slideshowTimer;



  function rotateFeatured() {

    featuredIndex = (featuredIndex + 1) % images.length;

    const nextSrc = images[featuredIndex];

    if (imgBack) imgBack.src = nextSrc;

    if (featuredImg) {

      featuredImg.style.opacity = "0";

      window.setTimeout(() => {

        featuredImg.src = nextSrc;

        featuredImg.style.opacity = "1";

      }, 450);

    }

  }



  function startSlideshow() {

    window.clearInterval(slideshowTimer);

    slideshowTimer = window.setInterval(() => {

      if (!lightbox.classList.contains("active")) rotateFeatured();

    }, 4500);

  }

  startSlideshow();



  function syncLightbox() {

    const src = currentIndex === 0 ? featuredImg.src : images[currentIndex];

    lbImg.src = src;

    lbImg.alt = `Gallery image ${String(currentIndex + 1).padStart(2, "0")}`;

    downloadLink.href = src;

    downloadLink.download = `biplov-gallery-${String(currentIndex + 1).padStart(2, "0")}.jpg`;

    if (counter) counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${images.length}`;

  }



  window.openLightbox = function(index) {

    currentIndex = Math.max(0, Math.min(images.length - 1, Number(index) || 0));

    syncLightbox();

    lightbox.classList.add("active");

    lightbox.setAttribute("aria-hidden", "false");

    document.body.style.overflow = "hidden";

  };



  window.closeLightbox = function() {

    lightbox.classList.remove("active");

    lightbox.setAttribute("aria-hidden", "true");

    document.body.style.overflow = "";

  };



  function changeImage(direction) {

    currentIndex = (currentIndex + direction + images.length) % images.length;

    syncLightbox();

  }



  document.getElementById("lbPrev")?.addEventListener("click", () => changeImage(-1));

  document.getElementById("lbNext")?.addEventListener("click", () => changeImage(1));



  lightbox.addEventListener("click", event => {

    if (event.target === lightbox) window.closeLightbox();

  });



  document.addEventListener("keydown", event => {

    if (!lightbox.classList.contains("active")) return;

    if (event.key === "Escape") window.closeLightbox();

    if (event.key === "ArrowLeft") changeImage(-1);

    if (event.key === "ArrowRight") changeImage(1);

  });



  let touchStartX = 0;

  lightbox.addEventListener("touchstart", event => {

    touchStartX = event.changedTouches[0].screenX;

  }, { passive: true });



  lightbox.addEventListener("touchend", event => {

    const delta = event.changedTouches[0].screenX - touchStartX;

    if (Math.abs(delta) > 55) changeImage(delta < 0 ? 1 : -1);

  }, { passive: true });



  document.querySelectorAll(".gallery-item").forEach(item => {

    item.setAttribute("role", "button");

    item.setAttribute("tabindex", "0");

    item.setAttribute("aria-label", item.querySelector(".item-title")?.textContent.trim() || "Open gallery image");

    item.addEventListener("keydown", event => {

      if (event.key === "Enter" || event.key === " ") {

        event.preventDefault();

        item.click();

      }

    });

  });

})();

</script>




<script>
/* Minimal keyboard/context-menu deterrents. These do not affect gallery controls or downloads. */
document.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});
document.addEventListener("dragstart", function (event) {
  if (event.target && event.target.tagName === "IMG") event.preventDefault();
});
document.addEventListener("keydown", function (event) {
  var key = (event.key || "").toLowerCase();
  if (
    key === "f12" ||
    (event.ctrlKey && !event.shiftKey && key === "u") ||
    (event.ctrlKey && event.shiftKey && ["i", "j", "c", "k"].includes(key))
  ) {
    event.preventDefault();
    event.stopPropagation();
  }
}, true);
</script>

</body>

</html>
